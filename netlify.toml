[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"
  # Env var *names* in source are not secrets - omit so demo docs do not fail CI.
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,PAYMENT_GATEWAY,SESSION_SECRET,LIBSQL_AUTH_TOKEN,TURSO_AUTH_TOKEN,DIRECT_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,bun.lock,docs"

[[plugins]]
  package = "@netlify/plugin-nextjs"
